name: desktop-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build \
            qt6-base-dev qt6-declarative-dev \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libssl-dev libcurl4-openssl-dev \
            libusb-1.0-0-dev libva-dev nasm glslang-tools
          python3 -m pip install --break-system-packages cmake

      - name: Install newer CMake (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check cmake

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=ON \
            -DENABLE_QT_TRANSLATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER= \
            -DCMAKE_CXX_COMPILER_LAUNCHER=

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=ON \
            -DYUZU_USE_BUNDLED_QT=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: eden-desktop-${{ matrix.os }}
          path: |
            build/bin/**/*
          if-no-files-found: warn
          retention-days: 14