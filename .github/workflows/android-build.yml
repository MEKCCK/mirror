name: android-build

on:
  push:
    branches:
      - 'feature/**'
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" \
                     "build-tools;35.0.0" \
                     "ndk;28.2.13676358" \
                     "cmake;3.31.6"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Build Mainline (Release)
        working-directory: src/android
        run: |
          ./gradlew assembleMainlineRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-mainline-release
          path: |
            src/android/app/build/outputs/apk/mainline/debug/*.apk
            src/android/app/build/outputs/apk/mainline/debug/*.aab
          if-no-files-found: warn
          retention-days: 14
